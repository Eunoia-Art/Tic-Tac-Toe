<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Tic-Tac-Toe</title>

  <!-- ============================================================
       STYLES
       ============================================================ -->
  <style>
    /* ── CSS Custom Properties ───────────────────────────────── */
    :root {
      --bg:            #07070f;
      --surface:       rgba(255,255,255,0.04);
      --surface-h:     rgba(255,255,255,0.08);
      --border:        rgba(255,255,255,0.09);
      --border-h:      rgba(255,255,255,0.2);

      --cyan:   #00f0ff;
      --pink:   #ff0a8a;
      --purple: #8b00ff;
      --green:  #00ffaa;
      --white:  #dde2ff;
      --dim:    rgba(221,226,255,0.45);

      --glow-c: 0 0 8px var(--cyan), 0 0 24px rgba(0,240,255,.35);
      --glow-p: 0 0 8px var(--pink), 0 0 24px rgba(255,10,138,.35);

      --cell: clamp(80px, min(27vw, 27vh), 150px);
      --gap:  8px;
      --r:    16px;
    }

    /* ── Reset ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      font-family: 'Courier New', Courier, monospace;
      color: var(--white);
    }

    /* ── Particle Canvas ─────────────────────────────────────── */
    #fx {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* ── Screen System ───────────────────────────────────────── */
    .screen {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity .35s ease;
    }
    .screen.active { opacity: 1; pointer-events: all; }

    /* ── Glassmorphism Card ──────────────────────────────────── */
    .card {
      background: rgba(5, 5, 20, 0.72);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 40px 36px;
      width: 100%; max-width: 400px;
      box-shadow:
        0 4px 32px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.07),
        inset 0 -1px 0 rgba(0,0,0,.3);
    }

    /* ── Typography ──────────────────────────────────────────── */
    .title {
      font-size: clamp(3.2rem, 12vw, 7.5rem);
      font-weight: 900; letter-spacing: .18em; text-transform: uppercase;
      text-align: center; line-height: 1;
      background: linear-gradient(135deg, var(--cyan) 0%, #a855f7 50%, var(--pink) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(0,240,255,.4));
      animation: titlePulse 4s ease-in-out infinite;
    }
    @keyframes titlePulse {
      0%,100% { filter: drop-shadow(0 0 20px rgba(0,240,255,.4)); }
      50%      { filter: drop-shadow(0 0 40px rgba(255,10,138,.6)); }
    }

    .subtitle {
      font-size: clamp(.55rem, 1.8vw, .8rem);
      letter-spacing: .55em; text-transform: uppercase; color: var(--dim);
      text-align: center; margin-top: 6px; margin-bottom: 40px;
    }

    .card-label {
      font-size: .7rem; letter-spacing: .35em; text-transform: uppercase;
      color: var(--dim); text-align: center; margin-bottom: 28px;
    }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn {
      display: block; width: 100%;
      padding: 15px 28px;
      font-family: inherit; font-size: clamp(.78rem, 2.2vw, .92rem);
      font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
      text-align: center; border: none; border-radius: 12px;
      cursor: pointer; outline: none; position: relative; overflow: hidden;
      transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
    }
    .btn + .btn { margin-top: 14px; }

    /* Shimmer sweep */
    .btn::after {
      content: '';
      position: absolute; top: 0; left: -120%;
      width: 80%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
      transition: left .45s ease;
    }
    .btn:hover::after { left: 130%; }

    .btn:active { transform: scale(.97); }

    /* Cyan variant */
    .btn-c {
      background: rgba(0,240,255,.08);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 14px rgba(0,240,255,.18), inset 0 1px 0 rgba(0,240,255,.12);
    }
    .btn-c:hover {
      background: rgba(0,240,255,.16);
      box-shadow: var(--glow-c), 0 4px 24px rgba(0,240,255,.2);
      transform: translateY(-2px);
    }

    /* Pink variant */
    .btn-p {
      background: rgba(255,10,138,.08);
      border: 1px solid var(--pink);
      color: var(--pink);
      box-shadow: 0 0 14px rgba(255,10,138,.18), inset 0 1px 0 rgba(255,10,138,.12);
    }
    .btn-p:hover {
      background: rgba(255,10,138,.16);
      box-shadow: var(--glow-p), 0 4px 24px rgba(255,10,138,.2);
      transform: translateY(-2px);
    }

    /* Ghost variant */
    .btn-g {
      background: transparent; border: 1px solid var(--border); color: var(--dim);
    }
    .btn-g:hover { border-color: var(--border-h); color: var(--white); background: var(--surface-h); }

    /* Small */
    .btn-sm { padding: 9px 16px; font-size: .7rem; width: auto; display: inline-block; }

    /* ── Inputs ──────────────────────────────────────────────── */
    .field-wrap { margin-bottom: 18px; }

    .field-label {
      display: block; font-size: .65rem; letter-spacing: .3em;
      text-transform: uppercase; color: var(--dim); margin-bottom: 7px;
    }

    .field {
      width: 100%; padding: 13px 16px;
      background: rgba(255,255,255,.045); border: 1px solid var(--border);
      border-radius: 10px; color: var(--white);
      font-family: inherit; font-size: .95rem; letter-spacing: .04em;
      outline: none; transition: border-color .25s, box-shadow .25s, background .25s;
    }
    .field:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0,240,255,.1), 0 0 18px rgba(0,240,255,.08);
      background: rgba(0,240,255,.04);
    }
    .field::placeholder { color: var(--dim); }
    .field:disabled { opacity: .45; cursor: not-allowed; }

    /* ── Decorative divider ──────────────────────────────────── */
    .deco {
      width: 0; height: 2px; margin: 14px auto 44px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
      border-radius: 2px;
      animation: decoGrow .8s ease-out .4s forwards;
    }
    @keyframes decoGrow { to { width: 80px; } }

    /* ── Animations: screen entrance ────────────────────────── */
    .slide-up {
      opacity: 0; transform: translateY(30px);
      animation: slideUp .55s cubic-bezier(.34,1.56,.64,1) .25s forwards;
    }
    .fade-in {
      opacity: 0;
      animation: fadeIn .6s ease .15s forwards;
    }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn  { to { opacity: 1; } }

    /* ══════════════════════════════════════════════════════════
       GAME SCREEN
       ══════════════════════════════════════════════════════════ */
    #gameScreen {
      justify-content: flex-start; overflow-y: auto;
      padding-top: 16px; padding-bottom: 20px;
      /* allow scrolling on very small screens */
      overscroll-behavior: contain;
    }

    .g-header {
      width: 100%; max-width: 492px;
      display: flex; justify-content: flex-end;
      gap: 8px; margin-bottom: 14px;
    }

    /* Scoreboard */
    .scoreboard {
      width: 100%; max-width: 492px;
      display: grid; grid-template-columns: 1fr auto 1fr;
      gap: 8px; margin-bottom: 14px;
    }
    .sb-cell {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 10px; text-align: center;
    }
    .sb-cell.sb-x { border-color: rgba(0,240,255,.25); }
    .sb-cell.sb-d { border-color: rgba(255,255,255,.12); }
    .sb-cell.sb-o { border-color: rgba(255,10,138,.25); }

    .sb-name {
      font-size: .6rem; letter-spacing: .15em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sb-val { font-size: 2rem; font-weight: 900; line-height: 1; }
    .sb-x .sb-val { color: var(--cyan); }
    .sb-d .sb-val { color: var(--dim); }
    .sb-o .sb-val { color: var(--pink); }

    /* Turn indicator */
    .turn-pill {
      padding: 9px 28px; border-radius: 50px;
      background: var(--surface); border: 1px solid var(--border);
      font-size: clamp(.7rem, 2.3vw, .85rem); letter-spacing: .18em;
      text-transform: uppercase; text-align: center;
      margin-bottom: 14px; transition: all .3s ease;
    }
    .turn-pill.tx { border-color: rgba(0,240,255,.35); color: var(--cyan); box-shadow: 0 0 12px rgba(0,240,255,.12); }
    .turn-pill.to { border-color: rgba(255,10,138,.35); color: var(--pink); box-shadow: 0 0 12px rgba(255,10,138,.12); }

    /* Board */
    #board {
      display: grid;
      grid-template-columns: repeat(3, var(--cell));
      grid-template-rows:    repeat(3, var(--cell));
      gap: var(--gap);
    }

    .cell {
      width: var(--cell); height: var(--cell);
      background: rgba(255,255,255,.035);
      border: 1px solid var(--border);
      border-radius: var(--r);
      display: flex; align-items: center; justify-content: center;
      font-size: calc(var(--cell) * .44); font-weight: 900;
      cursor: pointer; user-select: none;
      transition: background .18s, border-color .18s;
      position: relative; overflow: hidden;
    }
    /* hover ripple bg */
    .cell::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,.06), transparent 70%);
      opacity: 0; transition: opacity .2s;
    }
    .cell:hover:not(.taken)::before { opacity: 1; }
    .cell:hover:not(.taken) { background: rgba(255,255,255,.065); border-color: rgba(255,255,255,.18); }
    .cell.taken { cursor: default; }

    /* X cell */
    .cell.cx {
      color: var(--cyan);
      border-color: rgba(0,240,255,.3);
      text-shadow: var(--glow-c);
      animation: pop .28s cubic-bezier(.34,1.56,.64,1);
    }
    /* O cell */
    .cell.co {
      color: var(--pink);
      border-color: rgba(255,10,138,.3);
      text-shadow: var(--glow-p);
      animation: pop .28s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes pop {
      from { transform: scale(0) rotate(-8deg); opacity: 0; }
      to   { transform: scale(1) rotate(0);     opacity: 1; }
    }

    /* Winning cells */
    .cell.win {
      animation: winFlash .55s ease forwards;
    }
    .cell.cx.win {
      background: rgba(0,240,255,.14);
      border-color: var(--cyan);
      box-shadow: 0 0 18px rgba(0,240,255,.45), inset 0 0 18px rgba(0,240,255,.1);
    }
    .cell.co.win {
      background: rgba(255,10,138,.14);
      border-color: var(--pink);
      box-shadow: 0 0 18px rgba(255,10,138,.45), inset 0 0 18px rgba(255,10,138,.1);
    }
    @keyframes winFlash {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.1); }
      70%  { transform: scale(.97); }
      100% { transform: scale(1.04); }
    }

    /* ══════════════════════════════════════════════════════════
       RESULT OVERLAY
       ══════════════════════════════════════════════════════════ */
    #resultOverlay {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      background: rgba(5, 5, 18, .82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0; pointer-events: none;
      transition: opacity .35s ease;
    }
    #resultOverlay.active { opacity: 1; pointer-events: all; }

    .r-card {
      text-align: center; padding: 48px 36px;
      max-width: 380px; width: 100%;
      background: rgba(7,7,20,.92);
      border-radius: 26px;
      animation: resultPop .5s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes resultPop {
      from { transform: scale(.5) translateY(60px); opacity: 0; }
      to   { transform: scale(1) translateY(0);     opacity: 1; }
    }

    .r-card.rw-x { border: 1px solid var(--cyan); box-shadow: 0 0 40px rgba(0,240,255,.3), 0 0 80px rgba(0,240,255,.1); }
    .r-card.rw-o { border: 1px solid var(--pink); box-shadow: 0 0 40px rgba(255,10,138,.3), 0 0 80px rgba(255,10,138,.1); }
    .r-card.rd   { border: 1px solid rgba(255,255,255,.15); box-shadow: 0 0 30px rgba(255,255,255,.07); }

    .r-icon {
      font-size: 4rem; display: block; margin-bottom: 14px;
      animation: iconDrop .6s cubic-bezier(.34,1.56,.64,1) .15s both;
    }
    @keyframes iconDrop {
      from { transform: scale(0) rotate(-20deg); }
      to   { transform: scale(1) rotate(0); }
    }

    .r-title {
      font-size: clamp(1.5rem, 5.5vw, 2.4rem); font-weight: 900;
      letter-spacing: .1em; text-transform: uppercase;
      margin-bottom: 6px; line-height: 1.2;
    }
    .rw-x .r-title { color: var(--cyan); text-shadow: var(--glow-c); }
    .rw-o .r-title { color: var(--pink); text-shadow: var(--glow-p); }
    .rd   .r-title { color: var(--white); }

    .r-sub {
      font-size: .7rem; letter-spacing: .35em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 32px;
    }
    .r-btns { display: flex; flex-direction: column; gap: 12px; }

    /* ── Responsive tweaks ───────────────────────────────────── */
    @media (max-width: 440px) {
      :root { --cell: clamp(72px, 28vw, 120px); }
      .card { padding: 28px 20px; }
      .r-card { padding: 36px 22px; }
    }
    @media (max-height: 680px) {
      :root { --cell: clamp(68px, 25vh, 110px); }
      #gameScreen { padding-top: 10px; }
      .scoreboard, .turn-pill { margin-bottom: 9px; }
    }

    /* ── Difficulty Picker ───────────────────────────────────── */
    .diff-section { margin-bottom: 20px; }

    .diff-section-label {
      display: block; font-size: .65rem; letter-spacing: .3em;
      text-transform: uppercase; color: var(--dim); margin-bottom: 10px;
    }

    .diff-row { display: flex; gap: 8px; }

    .diff-btn {
      flex: 1; padding: 11px 4px;
      font-family: inherit; font-size: .68rem;
      font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      border-radius: 10px; cursor: pointer; outline: none;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.035);
      color: var(--dim);
      transition: all .2s ease;
      position: relative; overflow: hidden;
    }
    .diff-btn::after {
      content: ''; position: absolute; top: 0; left: -110%;
      width: 70%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.1), transparent);
      transition: left .4s ease;
    }
    .diff-btn:hover::after { left: 130%; }

    /* Easy — neon green */
    .diff-btn[data-diff="easy"].diff-active,
    .diff-btn[data-diff="easy"]:hover {
      border-color: var(--green); color: var(--green);
      background: rgba(0,255,170,.09);
      box-shadow: 0 0 12px rgba(0,255,170,.18);
    }
    /* Medium — amber */
    .diff-btn[data-diff="medium"].diff-active,
    .diff-btn[data-diff="medium"]:hover {
      border-color: #ffb300; color: #ffb300;
      background: rgba(255,179,0,.09);
      box-shadow: 0 0 12px rgba(255,179,0,.18);
    }
    /* Hard — pink */
    .diff-btn[data-diff="hard"].diff-active,
    .diff-btn[data-diff="hard"]:hover {
      border-color: var(--pink); color: var(--pink);
      background: rgba(255,10,138,.09);
      box-shadow: 0 0 12px rgba(255,10,138,.18);
    }

    /* ── In-game difficulty badge (left side of header) ──────── */
    .diff-badge {
      font-size: .62rem; letter-spacing: .18em; text-transform: uppercase;
      padding: 5px 12px; border-radius: 50px; border: 1px solid transparent;
      margin-right: auto; align-self: center;
    }
    .diff-badge.db-easy   { color: var(--green);  border-color: rgba(0,255,170,.35);  background: rgba(0,255,170,.07); }
    .diff-badge.db-medium { color: #ffb300;        border-color: rgba(255,179,0,.35);  background: rgba(255,179,0,.07); }
    .diff-badge.db-hard   { color: var(--pink);    border-color: rgba(255,10,138,.35); background: rgba(255,10,138,.07); }

    /* ── Utility ─────────────────────────────────────────────── */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- Particle / grid background -->
<canvas id="fx"></canvas>

<!-- ════════════════════════════════════════════════════════════
     MAIN MENU
     ════════════════════════════════════════════════════════════ -->
<div class="screen active" id="menuScreen">
  <div class="fade-in">
    <h1 class="title">TIC&#8209;TAC&#8209;TOE</h1>
    <p class="subtitl</p>
  </div>
  <div class="deco"></div>
  <div class="card slide-up" style="max-width:320px;">
    <button class="btn btn-c" id="btnPvP">⚡ &nbsp;Player vs Player</button>
    <button class="btn btn-p" id="btnPvB">🤖 &nbsp;Player vs Bot</button>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     NAME INPUT
     ════════════════════════════════════════════════════════════ -->
<div class="screen" id="nameScreen">
  <div class="card slide-up">
    <div class="card-label" id="nameModeLabel">Enter Player Names</div>

    <div class="field-wrap">
      <label class="field-label" for="inp1">Player 1 &nbsp;·&nbsp; X</label>
      <input class="field" id="inp1" type="text" placeholder="Player 1" maxlength="16" autocomplete="off" />
    </div>

    <!-- PvP: second player -->
    <div class="field-wrap" id="inp2Wrap">
      <label class="field-label" for="inp2">Player 2 &nbsp;·&nbsp; O</label>
      <input class="field" id="inp2" type="text" placeholder="Player 2" maxlength="16" autocomplete="off" />
    </div>

    <!-- PvB: bot label -->
    <div class="field-wrap hidden" id="botWrap">
      <label class="field-label">Bot &nbsp;·&nbsp; O</label>
      <input class="field" type="text" value="AI Bot" disabled />
    </div>

    <!-- PvB: difficulty picker (hidden in PvP) -->
    <div class="diff-section hidden" id="diffSection">
      <span class="diff-section-label">🎯 &nbsp;Bot Difficulty</span>
      <div class="diff-row">
        <button class="diff-btn" data-diff="easy">🟢 Easy</button>
        <button class="diff-btn" data-diff="medium">🟡 Medium</button>
        <button class="diff-btn diff-active" data-diff="hard">🔴 Hard</button>
      </div>
    </div>

    <button class="btn btn-c" id="btnStart" style="margin-top:6px;">▶ &nbsp;Start Game</button>
    <button class="btn btn-g" id="btnBack" style="margin-top:12px;">← &nbsp;Back</button>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     GAME
     ════════════════════════════════════════════════════════════ -->
<div class="screen" id="gameScreen">
  <!-- header buttons -->
  <div class="g-header">
    <span class="diff-badge hidden" id="diffBadge">HARD</span>
    <button class="btn btn-g btn-sm" id="btnRestart">↺ &nbsp;Restart</button>
    <button class="btn btn-g btn-sm" id="btnMenuGame">⌂ &nbsp;Menu</button>
  </div>

  <!-- scoreboard -->
  <div class="scoreboard" id="scoreboard">
    <div class="sb-cell sb-x">
      <div class="sb-name" id="sbNameX">P1</div>
      <div class="sb-val"  id="sbValX">0</div>
    </div>
    <div class="sb-cell sb-d" style="min-width:80px;">
      <div class="sb-name">DRAWS</div>
      <div class="sb-val" id="sbValD">0</div>
    </div>
    <div class="sb-cell sb-o">
      <div class="sb-name" id="sbNameO">P2</div>
      <div class="sb-val"  id="sbValO">0</div>
    </div>
  </div>

  <!-- whose turn -->
  <div class="turn-pill tx" id="turnPill">X's Turn</div>

  <!-- 3×3 board -->
  <div id="board"></div>
</div>

<!-- ════════════════════════════════════════════════════════════
     RESULT OVERLAY
     ════════════════════════════════════════════════════════════ -->
<div id="resultOverlay">
  <div class="r-card" id="rCard">
    <span class="r-icon" id="rIcon">🏆</span>
    <div class="r-title" id="rTitle">PLAYER WINS!</div>
    <div class="r-sub"   id="rSub">VICTORY</div>
    <div class="r-btns">
      <button class="btn btn-c" id="btnRRestart">↺ &nbsp;Play Again</button>
      <button class="btn btn-g" id="btnRMenu">⌂ &nbsp;Main Menu</button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     JAVASCRIPT
     ════════════════════════════════════════════════════════════ -->
<script>
'use strict';
/* ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ──
   SECTION 1 · PARTICLE / CANVAS BACKGROUND
── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── */
(function initCanvas() {
  const cvs = document.getElementById('fx');
  const ctx = cvs.getContext('2d');
  let W, H, particles = [], animId;

  function resize() {
    W = cvs.width  = window.innerWidth;
    H = cvs.height = window.innerHeight;
  }

  /** Individual floating dot */
  function Particle() {
    this.reset = () => {
      this.x  = Math.random() * W;
      this.y  = Math.random() * H;
      this.r  = Math.random() * 1.8 + .4;
      this.vx = (Math.random() - .5) * .35;
      this.vy = (Math.random() - .5) * .35;
      this.a  = Math.random() * .55 + .08;
      this.ph = Math.random() * Math.PI * 2;
      this.ps = Math.random() * .015 + .004;
      this.col = Math.random() > .5 ? '0,240,255' : '255,10,138';
    };
    this.update = () => {
      this.x  += this.vx;
      this.y  += this.vy;
      this.ph += this.ps;
      if (this.x < -6 || this.x > W + 6 || this.y < -6 || this.y > H + 6) this.reset();
    };
    this.draw = () => {
      const alpha = this.a * (.5 + .5 * Math.sin(this.ph));
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.col},${alpha})`;
      ctx.fill();
    };
    this.reset();
  }

  function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,.016)';
    ctx.lineWidth = 1;
    const s = 58;
    for (let x = 0; x < W; x += s) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += s) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    drawGrid();
    particles.forEach(p => { p.update(); p.draw(); });
    animId = requestAnimationFrame(loop);
  }

  function init() {
    resize();
    particles = Array.from({ length: 90 }, () => new Particle());
    if (animId) cancelAnimationFrame(animId);
    loop();
  }

  window.addEventListener('resize', () => { resize(); });
  init();
})();


/* ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ──
   SECTION 2 · AUDIO ENGINE (Web Audio API — no files)
── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── */
const Audio = (() => {
  let ctx = null;

  /** Lazy-init AudioContext (required by some browsers before user gesture) */
  function ac() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  }

  /**
   * Play an oscillator tone.
   * @param {number}   freq  Hz
   * @param {string}   type  OscillatorType
   * @param {number}   dur   seconds
   * @param {number}   vol   0-1 peak gain
   * @param {number}   delay seconds from now
   */
  function tone(freq, type, dur, vol = .3, delay = 0) {
    try {
      const c   = ac();
      const t0  = c.currentTime + delay;
      const osc = c.createOscillator();
      const g   = c.createGain();
      osc.connect(g);
      g.connect(c.destination);
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
      osc.start(t0);
      osc.stop(t0 + dur + .01);
    } catch (_) {}
  }

  return {
    /** Generic UI button click */
    click() { tone(480, 'square', .07, .18); },

    /** Placing X or O on board */
    place() {
      tone(640, 'triangle', .09, .22);
      tone(860, 'triangle', .07, .14, .07);
    },

    /** Win fanfare */
    win() {
      [[523,.28,.35],[659,.25,.35],[784,.22,.35],[1047,.45,.4]].forEach(
        ([f,d,v], i) => tone(f, 'triangle', d, v, i * .11)
      );
    },

    /** Draw — descending glum tones */
    draw() {
      tone(320, 'sawtooth', .14, .22);
      tone(270, 'sawtooth', .14, .22, .15);
      tone(210, 'sawtooth', .2,  .22, .3);
    },

    /** Back / cancel */
    back() { tone(360, 'sine', .09, .18); },
  };
})();


/* ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ──
   SECTION 3 · SCREEN MANAGER
── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── */
const Screens = (() => {
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  return { show };
})();


/* ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ──
   SECTION 4 · GAME STATE
── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── */
const Game = (() => {

  /* All winning index triplets */
  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6],
  ];

  /* Mutable state */
  let mode       = 'pvp';   // 'pvp' | 'pvb'
  let difficulty = 'hard';  // 'easy' | 'medium' | 'hard'
  let p1      = 'Player 1';
  let p2      = 'Player 2';
  let board   = Array(9).fill(null);
  let current = 'X';     // whose turn
  let over    = false;
  let scores  = { X: 0, O: 0, D: 0 };
  let botTimer= null;    // pending bot move timeout id

  /* ── MINIMAX (alpha-beta pruning) ──────────────────────── */
  /**
   * Returns 'X', 'O', 'draw', or null.
   * @param {Array} b  board snapshot
   */
  function getResult(b) {
    for (const [a, m, z] of WINS) {
      if (b[a] && b[a] === b[m] && b[a] === b[z]) return b[a];
    }
    return b.every(v => v) ? 'draw' : null;
  }

  /**
   * Minimax with alpha-beta pruning.
   * Maximiser = 'O' (bot), Minimiser = 'X' (human in PvB).
   */
  function minimax(b, depth, isMax, alpha, beta) {
    const res = getResult(b);
    if (res === 'O')    return  10 - depth;
    if (res === 'X')    return  depth - 10;
    if (res === 'draw') return  0;

    const empty = b.reduce((a, v, i) => v ? a : [...a, i], []);

    if (isMax) {
      let best = -Infinity;
      for (const i of empty) {
        b[i] = 'O';
        best = Math.max(best, minimax(b, depth + 1, false, alpha, beta));
        b[i] = null;
        alpha = Math.max(alpha, best);
        if (beta <= alpha) break;
      }
      return best;
    } else {
      let best = Infinity;
      for (const i of empty) {
        b[i] = 'X';
        best = Math.min(best, minimax(b, depth + 1, true, alpha, beta));
        b[i] = null;
        beta = Math.min(beta, best);
        if (beta <= alpha) break;
      }
      return best;
    }
  }

  /** Returns the best move index for 'O'. */
  function bestMove(b) {
    let score = -Infinity, idx = -1;
    b.forEach((v, i) => {
      if (v) return;
      b[i] = 'O';
      const s = minimax(b, 0, false, -Infinity, Infinity);
      b[i] = null;
      if (s > score) { score = s; idx = i; }
    });
    return idx;
  }

  /* ── DOM helpers ────────────────────────────────────────── */
  function $id(id) { return document.getElementById(id); }

  function renderBoard() {
    const el = $id('board');
    el.innerHTML = '';
    board.forEach((val, idx) => {
      const cell = document.createElement('div');
      cell.className = 'cell' + (val ? ` taken ${val === 'X' ? 'cx' : 'co'}` : '');
      cell.textContent = val || '';
      if (!val) cell.addEventListener('click', () => handleClick(idx));
      el.appendChild(cell);
    });
  }

  function updateTurnPill() {
    const el = $id('turnPill');
    const name = current === 'X' ? p1 : p2;
    el.textContent = `${name}'s Turn  (${current})`;
    el.className = `turn-pill ${current === 'X' ? 'tx' : 'to'}`;
  }

  function updateScoreboard() {
    $id('sbNameX').textContent = p1;
    $id('sbNameO').textContent = p2;
    $id('sbValX').textContent  = scores.X;
    $id('sbValO').textContent  = scores.O;
    $id('sbValD').textContent  = scores.D;
  }

  function highlightWinLine(line) {
    const cells = document.querySelectorAll('.cell');
    line.forEach(i => cells[i].classList.add('win'));
  }

  /* ── Result overlay ─────────────────────────────────────── */
  function showResult(type, winner) {
    const overlay = $id('resultOverlay');
    const card    = $id('rCard');
    const icon    = $id('rIcon');
    const title   = $id('rTitle');
    const sub     = $id('rSub');

    if (type === 'win') {
      const isX = winner === 'X';
      const name = isX ? p1 : p2;
      card.className  = `r-card ${isX ? 'rw-x' : 'rw-o'}`;
      icon.textContent  = '🏆';
      title.textContent = `${name} WINS!`;
      sub.textContent   = 'VICTORY';
      Audio.win();
    } else {
      card.className  = 'r-card rd';
      icon.textContent  = '🤝';
      title.textContent = "IT'S A DRAW!";
      sub.textContent   = 'NO WINNER';
      Audio.draw();
    }
    overlay.classList.add('active');
  }

  function hideResult() { $id('resultOverlay').classList.remove('active'); }

  /* ── Core move logic ────────────────────────────────────── */
  function handleClick(idx) {
    if (over || board[idx]) return;
    if (mode === 'pvb' && current === 'O') return; // block clicks during bot turn
    placeMove(idx);
  }

  function placeMove(idx) {
    board[idx] = current;
    Audio.place();
    renderBoard();
    checkGameOver();
  }

  function checkGameOver() {
    const result = getResult(board);

    if (result && result !== 'draw') {
      // Find & highlight winning line
      for (const line of WINS) {
        const [a, b2, c] = line;
        if (board[a] && board[a] === board[b2] && board[a] === board[c]) {
          setTimeout(() => highlightWinLine(line), 120);
          break;
        }
      }
      scores[result]++;
      over = true;
      updateScoreboard();
      setTimeout(() => showResult('win', result), 650);
      return;
    }

    if (result === 'draw') {
      scores.D++;
      over = true;
      updateScoreboard();
      setTimeout(() => showResult('draw'), 650);
      return;
    }

    // Switch player
    current = current === 'X' ? 'O' : 'X';
    updateTurnPill();

    // Schedule bot move
    if (mode === 'pvb' && current === 'O' && !over) {
      botTimer = setTimeout(doBotMove, 420);
    }
  }

  /** Returns a random empty cell index. */
  function randomMove(b) {
    const empty = b.reduce((a, v, i) => v ? a : [...a, i], []);
    return empty.length ? empty[Math.floor(Math.random() * empty.length)] : -1;
  }

  /**
   * Medium AI:
   *  1. Take a winning move if one exists.
   *  2. Block the opponent's winning move if one exists.
   *  3. Otherwise pick a random empty cell.
   * Smart enough to not blunder immediately, but still beatable.
   */
  function mediumMove(b) {
    // 1. Can 'O' win right now?
    for (const [a, m, z] of WINS) {
      if (b[a] === 'O' && b[m] === 'O' && !b[z]) return z;
      if (b[a] === 'O' && b[z] === 'O' && !b[m]) return m;
      if (b[m] === 'O' && b[z] === 'O' && !b[a]) return a;
    }
    // 2. Block 'X' from winning?
    for (const [a, m, z] of WINS) {
      if (b[a] === 'X' && b[m] === 'X' && !b[z]) return z;
      if (b[a] === 'X' && b[z] === 'X' && !b[m]) return m;
      if (b[m] === 'X' && b[z] === 'X' && !b[a]) return a;
    }
    // 3. Random
    return randomMove(b);
  }

  function doBotMove() {
    if (over) return;
    let idx;
    const snap = [...board];
    if      (difficulty === 'easy')   idx = randomMove(snap);
    else if (difficulty === 'medium') idx = mediumMove(snap);
    else                              idx = bestMove(snap);   // hard — full minimax
    if (idx !== -1) placeMove(idx);
  }

  /* ── Public API ─────────────────────────────────────────── */
  function init(opts) {
    /* opts: { mode, p1, p2, difficulty } */
    mode       = opts.mode;
    difficulty = opts.difficulty || 'hard';
    p1   = opts.p1 || 'Player 1';
    p2   = opts.p2 || (mode === 'pvb' ? 'AI Bot' : 'Player 2');
    scores = { X: 0, O: 0, D: 0 };

    /* Show/update difficulty badge only in PvB */
    const badge = $id('diffBadge');
    if (mode === 'pvb') {
      const labels = { easy: '🟢 EASY', medium: '🟡 MEDIUM', hard: '🔴 HARD' };
      const cls    = { easy: 'db-easy', medium: 'db-medium', hard: 'db-hard' };
      badge.textContent = labels[difficulty];
      badge.className   = `diff-badge ${cls[difficulty]}`;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }

    resetRound();
    Screens.show('gameScreen');
  }

  function resetRound() {
    if (botTimer) { clearTimeout(botTimer); botTimer = null; }
    board   = Array(9).fill(null);
    current = 'X';
    over    = false;
    hideResult();
    renderBoard();
    updateTurnPill();
    updateScoreboard();
  }

  function restart() {
    Audio.click();
    resetRound();
  }

  return { init, restart };
})();


/* ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ──
   SECTION 5 · EVENT WIRING
── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── */
(function wireEvents() {

  /* ── Main menu ──────────────────────────────────────────── */
  document.getElementById('btnPvP').addEventListener('click', () => {
    Audio.click();
    document.getElementById('nameModeLabel').textContent = 'Player vs Player';
    document.getElementById('inp2Wrap').classList.remove('hidden');
    document.getElementById('botWrap').classList.add('hidden');
    document.getElementById('diffSection').classList.add('hidden');
    document.getElementById('inp2').placeholder = 'Player 2';
    // Re-enable inp2 just in case
    document.getElementById('inp2').disabled = false;
    Screens.show('nameScreen');
  });

  document.getElementById('btnPvB').addEventListener('click', () => {
    Audio.click();
    document.getElementById('nameModeLabel').textContent = 'Player vs Bot';
    document.getElementById('inp2Wrap').classList.add('hidden');
    document.getElementById('botWrap').classList.remove('hidden');
    document.getElementById('diffSection').classList.remove('hidden');
    Screens.show('nameScreen');
  });

  /* ── Difficulty toggle buttons ──────────────────────────── */
  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      Audio.click();
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('diff-active'));
      btn.classList.add('diff-active');
    });
  });

  /* ── Name screen ────────────────────────────────────────── */
  document.getElementById('btnStart').addEventListener('click', () => {
    Audio.click();
    const isBvP = document.getElementById('botWrap').classList.contains('hidden') === false;
    const mode  = isBvP ? 'pvb' : 'pvp';
    const p1val = document.getElementById('inp1').value.trim();
    const p2val = document.getElementById('inp2').value.trim();
    /* Read selected difficulty from the active diff-btn */
    const activeBtn = document.querySelector('.diff-btn.diff-active');
    const diff = activeBtn ? activeBtn.dataset.diff : 'hard';
    Game.init({
      mode,
      difficulty: diff,
      p1: p1val || 'Player 1',
      p2: mode === 'pvb' ? 'AI Bot' : (p2val || 'Player 2'),
    });
  });

  document.getElementById('btnBack').addEventListener('click', () => {
    Audio.back();
    Screens.show('menuScreen');
  });

  /* Allow Enter to advance / start */
  document.getElementById('inp1').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const inp2Wrap = document.getElementById('inp2Wrap');
      if (!inp2Wrap.classList.contains('hidden')) {
        document.getElementById('inp2').focus();
      } else {
        document.getElementById('btnStart').click();
      }
    }
  });
  document.getElementById('inp2').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btnStart').click();
  });

  /* ── Game screen ────────────────────────────────────────── */
  document.getElementById('btnRestart').addEventListener('click', () => {
    Game.restart();
  });

  document.getElementById('btnMenuGame').addEventListener('click', () => {
    Audio.back();
    document.getElementById('resultOverlay').classList.remove('active');
    Screens.show('menuScreen');
  });

  /* ── Result overlay ─────────────────────────────────────── */
  document.getElementById('btnRRestart').addEventListener('click', () => {
    Game.restart();
  });

  document.getElementById('btnRMenu').addEventListener('click', () => {
    Audio.back();
    document.getElementById('resultOverlay').classList.remove('active');
    Screens.show('menuScreen');
  });
})();
</script>
